  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"23305fe5-fae0-4931-8e2c-cbfaf2f2cd5d\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"86239d1d-91ad-42c7-8f0c-488105ede347\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"702972f9-2de5-4278-aabf-1ba546ab5f05\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d3187ff6-ab31-46b2-91d1-932bfffd1d97\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"0a9f37e0-637a-4b27-9de2-411c76782099\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n* { box-sizing: border-box; }\nhtml, body { margin: 0; }\n@keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(.85); } to { opacity: 1; transform: none; } }\n@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }\n@keyframes roadDash { to { background-position: 30px 0; } }\n@keyframes collapse { 0% { opacity: 1; transform: none; } 18% { transform: translateY(-5px) rotate(-3deg); } 45% { transform: translateY(6px) scaleY(.9) rotate(2deg); } 100% { opacity: 0; transform: translateY(78px) scaleY(.45) scaleX(1.1) rotate(7deg); } }\n@keyframes poof { 0% { opacity: 0; transform: translateX(-50%) scale(.4); } 25% { opacity: 1; transform: translateX(-50%) scale(1); } 60% { opacity: .9; transform: translateX(-50%) scale(1.12); } 100% { opacity: 0; transform: translateX(-50%) scale(1.35); } }\n@keyframes toolWiggle { 0%,100% { transform: rotate(38deg); } 50% { transform: rotate(58deg); } }\n::selection { background: #d9e2db; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex; height:100vh; overflow:hidden; font-family:'DM Sans',sans-serif; color:#2b2a26; background:#fdfbf6;\">\n\n  <aside style=\"width:266px; flex-shrink:0; height:100vh; background:#f7f2e8; border-right:1px solid #e7e1d3; padding:26px 20px; display:flex; flex-direction:column; gap:24px; overflow:auto;\">\n    <div>\n      <div style=\"display:flex; align-items:baseline; gap:7px;\">\n        <span style=\"font-family:'Spectral',serif; font-size:23px; font-weight:600; color:#46624f;\">Liste<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:15px; color:#a8703f;\">.py<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#9a917f; margin-top:5px; letter-spacing:.02em;\">informatică · clasa a IX-a<\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em; color:#a89d86; text-transform:uppercase; margin-bottom:10px;\">Teme<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:3px;\">\n        <sc-for list=\"{{ teme }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <a onclick=\"{{ t.onClick }}\" style=\"{{ t.style }}\">\n            <span>{{ t.name }}<\u002Fspan>\n            <sc-if value=\"{{ t.soon }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.04em; color:#b7ac95; border:1px solid #e1d8c4; border-radius:20px; padding:2px 7px;\">curând<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fnav>\n\n    <nav>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em; color:#a89d86; text-transform:uppercase; margin-bottom:10px;\">Pe această pagină<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:1px;\">\n        <sc-for list=\"{{ subnav }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <a href=\"{{ s.href }}\" style=\"display:block; padding:7px 12px; border-left:2px solid #d8cfbd; color:#6b6557; font-size:13px; text-decoration:none;\">{{ s.name }}<\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fnav>\n\n    <div style=\"flex:1;\"><\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#b7ac95; line-height:1.6;\">{{ pageTag }}<\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex:1; height:100vh; overflow-y:auto;\">\n    <div style=\"max-width:880px; margin:0 auto; padding:52px 60px 90px;\">\n\n      <sc-if value=\"{{ tabLista }}\" hint-placeholder-val=\"{{ true }}\">\n       <div>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#a8703f; letter-spacing:.04em; margin-bottom:16px;\">Ce este o listă &nbsp;›&nbsp; Strada Listei<\u002Fdiv>\n        <h1 style=\"font-family:'Spectral',serif; font-size:46px; font-weight:600; line-height:1.04; margin:0 0 18px; color:#262521;\">Lista, ca o stradă<\u002Fh1>\n        <p style=\"font-size:17px; line-height:1.75; color:#4a463d; max-width:60ch; margin:0 0 38px;\">O listă seamănă cu o stradă scurtă. Fiecare casă are o <em style=\"font-style:italic; color:#46624f;\">adresă<\u002Fem> — un număr care începe de la <strong>0<\u002Fstrong> — iar înăuntru stă o <em style=\"font-style:italic; color:#46624f;\">valoare<\u002Fem>. Adresa este <strong>indicele<\u002Fstrong>, iar locatarul este <strong>elementul<\u002Fstrong> de pe acea poziție.<\u002Fp>\n\n        <div id=\"concept\" style=\"border-left:3px solid #c08a5a; background:#f7efe3; padding:18px 22px; margin:0 0 46px; border-radius:0 4px 4px 0;\">\n          <div style=\"font-size:13px; font-weight:600; color:#a8703f; margin-bottom:6px;\">De reținut<\u002Fdiv>\n          <div style=\"font-size:15.5px; line-height:1.65; color:#4a463d;\">Prima casă are adresa <strong>0<\u002Fstrong>, nu 1. Așa că o listă cu 6 elemente are adresele de la <strong>0<\u002Fstrong> la <strong>5<\u002Fstrong>.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"strada\" style=\"margin-bottom:46px;\">\n          <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:6px;\">\n            <span style=\"width:8px; height:8px; border-radius:50%; background:#46624f; display:inline-block; animation:bob 2s ease-in-out infinite;\"><\u002Fspan>\n            <h2 style=\"font-family:'Spectral',serif; font-size:26px; font-weight:600; margin:0; color:#262521;\">Strada Listei<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.65; color:#6b6557; margin:0 0 24px; max-width:58ch;\">Trece cu mouse-ul peste o casă ca s-o evidențiezi. Adaugă sau elimină case și urmărește cum se schimbă adresele.<\u002Fp>\n\n          <div style=\"background:#f7f2e8; border:1px solid #e7e1d3; border-radius:14px; padding:28px 26px 0; overflow:hidden;\">\n            <div style=\"display:flex; align-items:flex-end; gap:12px; margin-bottom:22px;\">\n              <div style=\"display:flex; flex-direction:column; align-items:center;\">\n                <div style=\"position:relative; background:#46624f; color:#fff; font-family:'Spectral',serif; font-weight:600; font-size:15px; padding:7px 16px; border-radius:4px; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5), 0 2px 6px rgba(0,0,0,.14);\">{{ numeStrada }}<\u002Fdiv>\n                <div style=\"width:5px; height:20px; background:#b9ac90; border-radius:0 0 2px 2px;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#9a917f; padding-bottom:5px;\">adresele caselor de pe stradă<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:20px; justify-content:center; align-items:flex-end; flex-wrap:wrap; min-height:128px;\">\n              <sc-for list=\"{{ houses }}\" as=\"h\" hint-placeholder-count=\"6\">\n                <div style=\"{{ h.wrap }}\" onmouseenter=\"{{ h.onEnter }}\" onmouseleave=\"{{ h.onLeave }}\">\n                  <div style=\"{{ h.puff }}\"><div style=\"position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); width:42px; height:26px; background:#fff; border-radius:15px; box-shadow:-17px 5px 0 -4px #fff, 17px 5px 0 -4px #fff, -8px -8px 0 -6px #fff, 11px -7px 0 -6px #fff, 0 2px 6px rgba(0,0,0,.06);\"><\u002Fdiv><div style=\"position:absolute; left:28%; top:30%; width:3px; height:13px; background:#8a8478; border-radius:2px; transform-origin:bottom center; animation:toolWiggle .3s ease-in-out infinite;\"><\u002Fdiv><div style=\"position:absolute; left:64%; top:26%; width:3px; height:13px; background:#a8703f; border-radius:2px; transform:rotate(-40deg);\"><\u002Fdiv><\u002Fdiv><div style=\"{{ h.roof }}\"><\u002Fdiv>\n                  <div style=\"{{ h.body }}\">\n                    <div style=\"{{ h.window }}\"><\u002Fdiv>\n                    <span style=\"{{ h.num }}\">{{ h.val }}<\u002Fspan>\n                    <div style=\"{{ h.door }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"{{ h.plate }}\">nr. {{ h.idx }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"height:36px; margin:16px -26px 0; background:#4a463d; position:relative; overflow:hidden;\">\n              <div style=\"position:absolute; top:50%; left:0; right:0; height:3px; transform:translateY(-50%); background-image:repeating-linear-gradient(90deg,#efe6d4 0,#efe6d4 14px,transparent 14px,transparent 30px); background-size:30px 3px; animation:roadDash 1.1s linear infinite;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:13.5px; color:#6b6557; background:#f1ece0; border-radius:6px; padding:12px 16px; margin:18px 0 0;\">{{ streetCode }}<\u002Fdiv>\n\n          <div style=\"display:flex; gap:12px; margin-top:18px; flex-wrap:wrap;\">\n            <button onclick=\"{{ onAdd }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#fff; background:#46624f; border:none; padding:11px 20px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#3a5141;\">+ Adaugă căsuță<\u002Fbutton>\n            <button onclick=\"{{ onRemove }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#6b6557; background:transparent; border:1.5px solid #d8cfbd; padding:11px 20px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#f1ece0;\">− Elimină ultima<\u002Fbutton>\n            <button onclick=\"{{ onReset }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#6b6557; background:transparent; border:1.5px solid #d8cfbd; padding:11px 20px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#f1ece0;\">↺ Resetează<\u002Fbutton>\n          <\u002Fdiv>\n\n          <p style=\"font-size:14px; line-height:1.6; color:#8a8478; margin:20px 0 0; max-width:58ch;\">Numerele de sub case sunt <strong style=\"color:#6b6557;\">adresele<\u002Fstrong> (indicii). Valoarea dinăuntru este <strong style=\"color:#6b6557;\">elementul<\u002Fstrong> de pe acea poziție.<\u002Fp>\n        <\u002Fdiv>\n\n        <div id=\"exers\">\n          <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:6px;\">\n            <span style=\"width:8px; height:8px; border-radius:50%; background:#a8703f; display:inline-block; animation:bob 2.3s ease-in-out infinite;\"><\u002Fspan>\n            <h2 style=\"font-family:'Spectral',serif; font-size:26px; font-weight:600; margin:0; color:#262521;\">Exersează<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.65; color:#6b6557; margin:0 0 22px; max-width:58ch;\">Răspunde la întrebări despre strada de mai sus. Scrie răspunsul și apasă <strong>Verifică<\u002Fstrong>.<\u002Fp>\n\n          <sc-if value=\"{{ hasQuiz }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#fff; border:1px solid #e7e1d3; border-radius:14px; padding:26px 28px;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:4px;\">\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.06em; color:#a8703f; text-transform:uppercase;\">Întrebare<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#9a917f;\">{{ scoreText }}<\u002Fdiv>\n              <\u002Fdiv>\n              <h3 style=\"font-family:'Spectral',serif; font-size:23px; font-weight:600; margin:0; color:#262521; line-height:1.2;\">{{ questionText }}<\u002Fh3>\n              <div style=\"display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; align-items:center;\">\n                <input value=\"{{ answer }}\" oninput=\"{{ onInput }}\" onkeydown=\"{{ onKey }}\" placeholder=\"{{ placeholder }}\" inputmode=\"numeric\" style=\"width:130px; font-family:'JetBrains Mono',monospace; font-size:16px; color:#2b2a26; background:#faf7f0; border:1.5px solid #d8cfbd; border-radius:8px; padding:11px 14px; outline:none;\" style-focus=\"border-color:#46624f; background:#fff;\">\n                <button onclick=\"{{ onCheck }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#fff; background:#46624f; border:none; padding:11px 22px; border-radius:8px; cursor:pointer;\" style-hover=\"background:#3a5141;\">Verifică<\u002Fbutton>\n                <button onclick=\"{{ onNew }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#6b6557; background:transparent; border:1.5px solid #d8cfbd; padding:11px 18px; border-radius:8px; cursor:pointer;\" style-hover=\"background:#f7f2e8;\">Întrebare nouă<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"{{ feedbackStyle }}\">{{ feedback }}<\u002Fdiv>\n              <p style=\"font-size:13px; color:#a89d86; margin:14px 0 0; font-family:'JetBrains Mono',monospace;\">indiciu: numără adresele de la 0, începând cu prima casă<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n       <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabParcurgere }}\" hint-placeholder-val=\"{{ true }}\">\n       <div>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#a8703f; letter-spacing:.04em; margin-bottom:16px;\">Parcurgere și căutare &nbsp;›&nbsp; Poștașul<\u002Fdiv>\n        <h1 style=\"font-family:'Spectral',serif; font-size:46px; font-weight:600; line-height:1.04; margin:0 0 18px; color:#262521;\">Poștașul listei<\u002Fh1>\n        <p style=\"font-size:17px; line-height:1.75; color:#4a463d; max-width:60ch; margin:0 0 38px;\">Ca să folosești o listă, treci pe la fiecare casă, pe rând. <em style=\"font-style:italic; color:#46624f;\">Poștașul<\u002Fem> este indicele: pornește de la adresa <strong>0<\u002Fstrong> și merge din casă în casă, citind valoarea de la fiecare. Asta înseamnă <strong>parcurgerea<\u002Fstrong> unei liste.<\u002Fp>\n\n        <div id=\"concept\" style=\"border-left:3px solid #c08a5a; background:#f7efe3; padding:18px 22px; margin:0 0 46px; border-radius:0 4px 4px 0;\">\n          <div style=\"font-size:13px; font-weight:600; color:#a8703f; margin-bottom:6px;\">De reținut<\u002Fdiv>\n          <div style=\"font-size:15.5px; line-height:1.65; color:#4a463d;\">Poștașul (indicele <strong>i<\u002Fstrong>) merge de la <strong>0<\u002Fstrong> până la <strong>len(strada) − 1<\u002Fstrong>. La fiecare pas citește <code style=\"font-family:'JetBrains Mono',monospace; background:#efe3d2; padding:1px 5px; border-radius:4px;\">strada[i]<\u002Fcode>.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"postas\" style=\"margin-bottom:46px;\">\n          <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:6px;\">\n            <span style=\"width:8px; height:8px; border-radius:50%; background:#46624f; display:inline-block; animation:bob 2s ease-in-out infinite;\"><\u002Fspan>\n            <h2 style=\"font-family:'Spectral',serif; font-size:26px; font-weight:600; margin:0; color:#262521;\">Poștașul pe stradă<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.65; color:#6b6557; margin:0 0 24px; max-width:58ch;\">Apasă „Pas înainte\" sau pornește mersul automat. Poștașul se mută la următoarea casă și citește valoarea de acolo.<\u002Fp>\n\n          <div style=\"background:#f7f2e8; border:1px solid #e7e1d3; border-radius:14px; padding:28px 26px 0; overflow:hidden;\">\n            <div style=\"display:flex; align-items:flex-end; gap:12px; margin-bottom:8px;\">\n              <div style=\"display:flex; flex-direction:column; align-items:center;\">\n                <div style=\"position:relative; background:#46624f; color:#fff; font-family:'Spectral',serif; font-weight:600; font-size:15px; padding:7px 16px; border-radius:4px; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5), 0 2px 6px rgba(0,0,0,.14);\">{{ numeStrada }}<\u002Fdiv>\n                <div style=\"width:5px; height:20px; background:#b9ac90; border-radius:0 0 2px 2px;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#9a917f; padding-bottom:5px;\">{{ stepText }}<\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"position:relative; display:flex; gap:20px; justify-content:flex-start; align-items:flex-end; min-height:128px; margin-top:96px;\">\n              <div style=\"{{ markerStyle }}\">\n                <div style=\"position:relative; width:48px; height:48px; border-radius:50%; background:#eef3ef; border:2px solid #46624f; overflow:hidden; box-shadow:0 6px 14px rgba(70,98,79,.30); animation:bob 1.7s ease-in-out infinite;\">\n                  <div style=\"position:absolute; top:16px; left:14px; width:20px; height:20px; border-radius:50%; background:#e8c79f;\"><\u002Fdiv>\n                  <div style=\"position:absolute; top:6px; left:12px; width:24px; height:9px; background:#46624f; border-radius:9px 9px 2px 2px;\"><\u002Fdiv>\n                  <div style=\"position:absolute; top:13px; left:9px; width:30px; height:4px; background:#3a5141; border-radius:3px;\"><\u002Fdiv>\n                  <div style=\"position:absolute; bottom:0; left:0; right:0; height:15px; background:#46624f;\"><\u002Fdiv>\n                  <div style=\"position:absolute; bottom:2px; left:16px; width:16px; height:11px; background:#fff; border:1px solid #cdd8d0; border-radius:1px;\"><\u002Fdiv>\n                  <div style=\"position:absolute; bottom:8px; left:16px; width:0; height:0; border-left:8px solid transparent; border-right:8px solid transparent; border-top:5px solid #e3e9e4;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:7px; margin-top:6px; background:#46624f; color:#fff; padding:4px 11px; border-radius:16px; box-shadow:0 4px 10px rgba(70,98,79,.28); white-space:nowrap;\">\n                  <span style=\"font-family:'DM Sans',sans-serif; font-size:11.5px; font-weight:600;\">poștașul<\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#bcd6c7;\">i = {{ cursor }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-top:8px solid #46624f;\"><\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-for list=\"{{ thouses }}\" as=\"h\" hint-placeholder-count=\"6\">\n                <div style=\"{{ h.wrap }}\" onmouseenter=\"{{ h.onEnter }}\" onmouseleave=\"{{ h.onLeave }}\">\n                  <div style=\"{{ h.puff }}\"><div style=\"position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); width:42px; height:26px; background:#fff; border-radius:15px; box-shadow:-17px 5px 0 -4px #fff, 17px 5px 0 -4px #fff, -8px -8px 0 -6px #fff, 11px -7px 0 -6px #fff, 0 2px 6px rgba(0,0,0,.06);\"><\u002Fdiv><div style=\"position:absolute; left:28%; top:30%; width:3px; height:13px; background:#8a8478; border-radius:2px; transform-origin:bottom center; animation:toolWiggle .3s ease-in-out infinite;\"><\u002Fdiv><div style=\"position:absolute; left:64%; top:26%; width:3px; height:13px; background:#a8703f; border-radius:2px; transform:rotate(-40deg);\"><\u002Fdiv><\u002Fdiv><div style=\"{{ h.roof }}\"><\u002Fdiv>\n                  <div style=\"{{ h.body }}\">\n                    <div style=\"{{ h.window }}\"><\u002Fdiv>\n                    <span style=\"{{ h.num }}\">{{ h.val }}<\u002Fspan>\n                    <div style=\"{{ h.door }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"{{ h.plate }}\">nr. {{ h.idx }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"height:36px; margin:16px -26px 0; background:#4a463d; position:relative; overflow:hidden;\">\n              <div style=\"position:absolute; top:50%; left:0; right:0; height:3px; transform:translateY(-50%); background-image:repeating-linear-gradient(90deg,#efe6d4 0,#efe6d4 14px,transparent 14px,transparent 30px); background-size:30px 3px; animation:roadDash 1.1s linear infinite;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; gap:14px; flex-wrap:wrap; margin-top:18px; align-items:stretch;\">\n            <div style=\"flex:1; min-width:230px; background:#272a26; border-radius:8px; padding:16px 20px; font-family:'JetBrains Mono',monospace; font-size:13.5px; line-height:1.85;\">\n              <div><span style=\"color:#c98ab0;\">for<\u002Fspan> <span style=\"color:#d9d4c7;\">i<\u002Fspan> <span style=\"color:#c98ab0;\">in<\u002Fspan> <span style=\"color:#a7c4b5;\">range<\u002Fspan><span style=\"color:#d9d4c7;\">(<\u002Fspan><span style=\"color:#a7c4b5;\">len<\u002Fspan><span style=\"color:#d9d4c7;\">(strada)):<\u002Fspan><\u002Fdiv>\n              <div style=\"background:rgba(167,196,181,.16); border-radius:4px; margin:2px -6px; padding:1px 6px;\"><span style=\"color:#d9d4c7;\">&nbsp;&nbsp;&nbsp;&nbsp;<\u002Fspan><span style=\"color:#a7c4b5;\">print<\u002Fspan><span style=\"color:#d9d4c7;\">(strada[i])<\u002Fspan><\u002Fdiv>\n              <div style=\"color:#7e8b7e; margin-top:4px;\">{{ loopComment }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1; min-width:230px; background:#fff; border:1px solid #e7e1d3; border-radius:8px; padding:16px 20px;\">\n              <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.05em; color:#a89d86; text-transform:uppercase; margin-bottom:10px;\">Afișate până acum<\u002Fdiv>\n              <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n                <sc-for list=\"{{ visitedList }}\" as=\"v\" hint-placeholder-count=\"3\">\n                  <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; color:#46624f; background:#eef3ef; border:1px solid #dbe6df; border-radius:6px; padding:5px 11px;\">{{ v.val }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;\">\n            <button onclick=\"{{ onPrev }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#6b6557; background:transparent; border:1.5px solid #d8cfbd; padding:11px 18px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#f1ece0;\">◀ Pas înapoi<\u002Fbutton>\n            <button onclick=\"{{ onNext }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#6b6557; background:transparent; border:1.5px solid #d8cfbd; padding:11px 18px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#f1ece0;\">Pas înainte ▶<\u002Fbutton>\n            <button onclick=\"{{ onPlay }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#fff; background:#46624f; border:none; padding:11px 22px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#3a5141;\">{{ playLabel }}<\u002Fbutton>\n            <button onclick=\"{{ onNewStreet }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#6b6557; background:transparent; border:1.5px solid #d8cfbd; padding:11px 18px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#f1ece0;\">Stradă nouă<\u002Fbutton>\n            <button onclick=\"{{ onResetTrav }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#6b6557; background:transparent; border:1.5px solid #d8cfbd; padding:11px 18px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#f1ece0;\">↺ Reset<\u002Fbutton>\n          <\u002Fdiv>\n\n          <p style=\"font-size:14px; line-height:1.6; color:#8a8478; margin:20px 0 0; max-width:58ch;\">La fiecare pas, <strong style=\"color:#6b6557;\">i<\u002Fstrong> crește cu 1, iar <code style=\"font-family:'JetBrains Mono',monospace; color:#6b6557;\">strada[i]<\u002Fcode> este valoarea citită. Când <strong style=\"color:#6b6557;\">i<\u002Fstrong> trece de ultima adresă, parcurgerea s-a terminat.<\u002Fp>\n        <\u002Fdiv>\n\n        <div id=\"exers\">\n          <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:6px;\">\n            <span style=\"width:8px; height:8px; border-radius:50%; background:#a8703f; display:inline-block; animation:bob 2.3s ease-in-out infinite;\"><\u002Fspan>\n            <h2 style=\"font-family:'Spectral',serif; font-size:26px; font-weight:600; margin:0; color:#262521;\">Exersează<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.65; color:#6b6557; margin:0 0 22px; max-width:58ch;\">Întrebări despre traseul poștașului de mai sus. Scrie răspunsul și apasă <strong>Verifică<\u002Fstrong>.<\u002Fp>\n\n          <sc-if value=\"{{ hasQuiz2 }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#fff; border:1px solid #e7e1d3; border-radius:14px; padding:26px 28px;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:4px;\">\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.06em; color:#a8703f; text-transform:uppercase;\">Întrebare<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#9a917f;\">{{ scoreText2 }}<\u002Fdiv>\n              <\u002Fdiv>\n              <h3 style=\"font-family:'Spectral',serif; font-size:23px; font-weight:600; margin:0; color:#262521; line-height:1.2;\">{{ questionText2 }}<\u002Fh3>\n              <div style=\"display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; align-items:center;\">\n                <input value=\"{{ answer2 }}\" oninput=\"{{ onInput2 }}\" onkeydown=\"{{ onKey2 }}\" placeholder=\"{{ placeholder2 }}\" inputmode=\"numeric\" style=\"width:130px; font-family:'JetBrains Mono',monospace; font-size:16px; color:#2b2a26; background:#faf7f0; border:1.5px solid #d8cfbd; border-radius:8px; padding:11px 14px; outline:none;\" style-focus=\"border-color:#46624f; background:#fff;\">\n                <button onclick=\"{{ onCheck2 }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#fff; background:#46624f; border:none; padding:11px 22px; border-radius:8px; cursor:pointer;\" style-hover=\"background:#3a5141;\">Verifică<\u002Fbutton>\n                <button onclick=\"{{ onNew2 }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#6b6557; background:transparent; border:1.5px solid #d8cfbd; padding:11px 18px; border-radius:8px; cursor:pointer;\" style-hover=\"background:#f7f2e8;\">Întrebare nouă<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"{{ feedbackStyle2 }}\">{{ feedback2 }}<\u002Fdiv>\n              <p style=\"font-size:13px; color:#a89d86; margin:14px 0 0; font-family:'JetBrains Mono',monospace;\">indiciu: pasul i merge de la 0; valoarea citită este strada[i]<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n       <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabGenerare }}\" hint-placeholder-val=\"{{ true }}\">\n       <div>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#a8703f; letter-spacing:.04em; margin-bottom:16px;\">Generarea elementelor &nbsp;›&nbsp; Șantierul listei<\u002Fdiv>\n        <h1 style=\"font-family:'Spectral',serif; font-size:46px; font-weight:600; line-height:1.04; margin:0 0 18px; color:#262521;\">Construiește o listă<\u002Fh1>\n        <p style=\"font-size:17px; line-height:1.75; color:#4a463d; max-width:60ch; margin:0 0 38px;\">O listă nu trebuie scrisă mereu de mână. O putem <em style=\"font-style:italic; color:#46624f;\">genera<\u002Fem>: pornim de la una goală și ridicăm câte o casă, după o regulă, într-o buclă. Fiecare pas adaugă o valoare nouă cu <code style=\"font-family:'JetBrains Mono',monospace; background:#efe3d2; padding:1px 5px; border-radius:4px;\">append()<\u002Fcode>.<\u002Fp>\n\n        <div id=\"concept\" style=\"border-left:3px solid #c08a5a; background:#f7efe3; padding:18px 22px; margin:0 0 46px; border-radius:0 4px 4px 0;\">\n          <div style=\"font-size:13px; font-weight:600; color:#a8703f; margin-bottom:6px;\">De reținut<\u002Fdiv>\n          <div style=\"font-size:15.5px; line-height:1.65; color:#4a463d;\"><code style=\"font-family:'JetBrains Mono',monospace;\">strada = []<\u002Fcode> e o stradă goală. Cu un <strong>for<\u002Fstrong> și <strong>append()<\u002Fstrong> ridicăm o casă la fiecare pas — valoarea ei vine din regula aleasă (de exemplu <code style=\"font-family:'JetBrains Mono',monospace;\">i * 2<\u002Fcode>).<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"generare\" style=\"margin-bottom:46px;\">\n          <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:6px;\">\n            <span style=\"width:8px; height:8px; border-radius:50%; background:#46624f; display:inline-block; animation:bob 2s ease-in-out infinite;\"><\u002Fspan>\n            <h2 style=\"font-family:'Spectral',serif; font-size:26px; font-weight:600; margin:0; color:#262521;\">Șantierul listei<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.65; color:#6b6557; margin:0 0 18px; max-width:58ch;\">Alege regula și numărul de case, apoi construiește strada pas cu pas.<\u002Fp>\n\n          <div style=\"display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin-bottom:20px;\">\n            <div style=\"display:flex; align-items:center; gap:8px;\">\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#8a8478;\">valoare =<\u002Fspan>\n              <sc-for list=\"{{ gOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <button onclick=\"{{ o.onClick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutt .5px solid #d8cfbd; padding:11px 18px; border-radius:8px; cursor:pointer;\" style-hover=\"background:#f7f2e8;\">Întrebare nouă<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"{{ feedbackStyle4 }}\">{{ feedback4 }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n       <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabOperatii }}\" hint-placeholder-val=\"{{ true }}\">\n       <div>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#a8703f; letter-spacing:.04em; margin-bottom:16px;\">Operații cu liste &nbsp;›&nbsp; Atelierul străzii<\u002Fdiv>\n        <h1 style=\"font-family:'Spectral',serif; font-size:46px; font-weight:600; line-height:1.04; margin:0 0 18px; color:#262521;\">Adaugă, șterge, modifică<\u002Fh1>\n        <p style=\"font-size:17px; line-height:1.75; color:#4a463d; max-width:60ch; margin:0 0 38px;\">O listă se poate schimba oricând. Putem ridica o casă nouă (<code style=\"font-family:'JetBrains Mono',monospace; background:#efe3d2; padding:1px 5px; border-radius:4px;\">append<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace; background:#efe3d2; padding:1px 5px; border-radius:4px;\">insert<\u002Fcode>), demola una (<code style=\"font-family:'JetBrains Mono',monospace; background:#efe3d2; padding:1px 5px; border-radius:4px;\">pop<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace; background:#efe3d2; padding:1px 5px; border-radius:4px;\">del<\u002Fcode>) sau renova valoarea dintr-o casă (<code style=\"font-family:'JetBrains Mono',monospace; background:#efe3d2; padding:1px 5px; border-radius:4px;\">strada[i] = …<\u002Fcode>).<\u002Fp>\n\n        <div id=\"concept\" style=\"border-left:3px solid #c08a5a; background:#f7efe3; padding:18px 22px; margin:0 0 46px; border-radius:0 4px 4px 0;\">\n          <div style=\"font-size:13px; font-weight:600; color:#a8703f; margin-bottom:6px;\">De reținut<\u002Fdiv>\n          <div style=\"font-size:15.5px; line-height:1.65; color:#4a463d;\">Când adaugi sau ștergi o casă din mijloc, <strong>adresele se renumerotează<\u002Fstrong> automat — celelalte case se mută cu o poziție.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"operatii\" style=\"margin-bottom:46px;\">\n          <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:6px;\">\n            <span style=\"width:8px; height:8px; border-radius:50%; background:#46624f; display:inline-block; animation:bob 2s ease-in-out infinite;\"><\u002Fspan>\n            <h2 style=\"font-family:'Spectral',serif; font-size:26px; font-weight:600; margin:0; color:#262521;\">Atelierul străzii<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.65; color:#6b6557; margin:0 0 18px; max-width:58ch;\">Alege o poziție și o valoare, apoi apasă o operație. Urmărește cum se schimbă strada și codul.<\u002Fp>\n\n          <div style=\"background:#f7f2e8; border:1px solid #e7e1d3; border-radius:14px; padding:28px 26px 0; overflow:hidden; margin-bottom:18px;\">\n            <div style=\"display:flex; align-items:flex-end; gap:12px; margin-bottom:22px;\">\n              <div style=\"display:flex; flex-direction:column; align-items:center;\">\n                <div style=\"position:relative; background:#46624f; color:#fff; font-family:'Spectral',serif; font-weight:600; font-size:15px; padding:7px 16px; border-radius:4px; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5), 0 2px 6px rgba(0,0,0,.14);\">{{ numeStrada }}<\u002Fdiv>\n                <div style=\"width:5px; height:20px; background:#b9ac90; border-radius:0 0 2px 2px;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#9a917f; padding-bottom:5px;\">atelier deschis<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:18px; justify-content:center; align-items:flex-end; flex-wrap:wrap; min-height:128px;\">\n 2Fbutton>\n            <button onclick=\"{{ onDelOp }}\" style=\"font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; color:#a8703f; background:#fff; border:1.5px solid #e6d3bb; padding:10px 16px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#f7ede1;\">del strada[poz]<\u002Fbutton>\n            <button onclick=\"{{ onPopOp }}\" style=\"font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; color:#a8703f; background:#fff; border:1.5px solid #e6d3bb; padding:10px 16px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#f7ede1;\">pop()<\u002Fbutton>\n            <button onclick=\"{{ onResetOp }}\" style=\"font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; color:#6b6557; background:transparent; border:1.5px solid #d8cfbd; padding:10px 16px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#f1ece0;\">↺ Reset<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"background:#272a26; border-radius:8px; padding:16px 20px; font-family:'JetBrains Mono',monospace; font-size:13.5px; line-height:1.8; color:#cfd8cf;\">\n            <sc-for list=\"{{ oLogLines }}\" as=\"l\" hint-placeholder-count=\"3\">\n              <div>{{ l.t }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"exers\">\n          <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:6px;\">\n            <span style=\"width:8px; height:8px; border-radius:50%; background:#a8703f; display:inline-block; animation:bob 2.3s ease-in-out infinite;\"><\u002Fspan>\n            <h2 style=\"font-family:'Spectral',serif; font-size:26px; font-weight:600; margin:0; color:#262521;\">Exersează<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.65; color:#6b6557; margin:0 0 22px; max-width:58ch;\">Întrebări despre strada de acum (după operațiile tale). Scrie răspunsul și apasă <strong>Verifică<\u002Fstrong>.<\u002Fp>\n          <sc-if value=\"{{ hasQuiz5 }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#fff; border:1px solid #e7e1d3; border-radius:14px; padding:26px 28px;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:4px;\">\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.06em; color:#a8703f; text-transform:uppercase;\">Întrebare<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#9a917f;\">{{ scoreText5 }}<\u002Fdiv>\n              <\u002Fdiv>\n              <h3 style=\"font-family:'Spectral',serif; font-size:23px; font-weight:600; margin:0; color:#262521; line-height:1.2;\">{{ questionText5 }}<\u002Fh3>\n              <div style=\"display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; align-items:center;\">\n                <input value=\"{{ answer5 }}\" oninput=\"{{ onInput5 }}\" onkeydown=\"{{ onKey5 }}\" placeholder=\"{{ placeholder5 }}\" inputmode=\"numeric\" style=\"width:130px; font-family:'JetBrains Mono',monospace; font-size:16px; color:#2b2a26; background:#faf7f0; border:1.5px solid #d8cfbd; border-radius:8px; padding:11px 14px; outline:none;\" style-focus=\"border-color:#46624f; background:#fff;\">\n                <button onclick=\"{{ onCheck5 }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#fff; background:#46624f; border:none; padding:11px 22px; border-radius:8px; cursor:pointer;\" style-hover=\"background:#3a5141;\">Verifică<\u002Fbutton>\n                <button onclick=\"{{ onNew5 }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#6b6557; background:transparent; border:1.5px solid #d8cfbd; padding:11px 18px; border-radius:8px; cursor:pointer;\" style-hover=\"background:#f7f2e8;\">Întrebare nouă<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"{{ feedbackStyle5 }}\">{{ feedback5 }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n       <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabSortare }}\" hint-placeholder-val=\"{{ true }}\">\n       <div>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#a8703f; letter-spacing:.04em; margin-bottom:16px;\">Sortarea listelor &nbsp;›&nbsp; Strada ordonată<\u002Fdiv>\n        <h1 style=\"font-family:'Spectral',serif; font-size:46px; font-weight:600; line-height:1.04; margin:0 0 18px; color:#262521;\">Pune strada în ordine<\u002Fh1>\n        <p style=\"font-size:17px; line-height:1.75; color:#4a463d; max-width:60ch; margin:0 0 38px;\">A <em style=\"font-style:italic; color:#46624f;\">sorta<\u002Fem> înseamnă a rearanja valorile crescător. Comparăm câte două case vecine și le schimbăm între ele dacă sunt în ordine greșită — până când toată strada e ordonată. În Python, <code style=\"font-family:'JetBrains Mono',monospace; background:#efe3d2; padding:1px 5px; border-radius:4px;\">strada.sort()<\u002Fcode> face asta automat.<\u002Fp>\n\n        <div id=\"concept\" style=\"border-left:3px solid #c08a5a; background:#f7efe3; padding:18px 22px; margin:0 0 46px; border-radius:0 4px 4px 0;\">\n          <div style=\"font-size:13px; font-weight:600; color:#a8703f; margin-bottom:6px;\">De reținut<\u002Fdiv>\n          <div style=\"font-size:15.5px; line-height:1.65; color:#4a463d;\">Casele mai înalte au valori mai mari. După sortarea crescătoare, cel mai mic număr ajunge la adresa <strong>0<\u002Fstrong>, iar cel mai mare la ultima adresă.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"sortare\" style=\"margin-bottom:46px;\">\n          <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:6px;\">\n            <span style=\"width:8px; height:8px; border-radius:50%; background:#46624f; display:inline-block; animation:bob 2s ease-in-out infinite;\"><\u002Fspan>\n            <h2 style=\"font-family:'Spectral',serif; font-size:26px; font-weight:600; margin:0; color:#262521;\">Sortare pas cu pas<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.65; color:#6b6557; margin:0 0 18px; max-width:58ch;\">Apasă „Pas\" ca să compari două case vecine, sau pornește sortarea automată. Casele evidențiate sunt cele comparate acum.<\u002Fp>\n\n          <div style=\"background:#f7f2e8; border:1px solid #e7e1d3; border-radius:14px; padding:28px 26px 0; overflow:hidden;\">\n            <div style=\"display:flex; align-items:flex-end; gap:12px; margin-bottom:22px;\">\n              <div style=\"display:flex; flex-direction:column; align-items:center;\">\n                <div style=\"position:relative; background:#46624f; color:#fff; font-family:'Spectral',serif; font-weight:600; font-size:15px; padding:7px 16px; border-radius:4px; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5), 0 2px 6px rgba(0,0,0,.14);\">{{ numeStrada }}<\u002Fdiv>\n                <div style=\"width:5px; height:20px; background:#b9ac90; border-radius:0 0 2px 2px;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#9a917f; padding-bottom:5px;\">o stradă de numere<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:18px; justify-content:center; align-items:flex-end; flex-wrap:wrap; min-height:150px;\">\n              <sc-for list=\"{{ sBars }}\" as=\"b\" hint-placeholder-count=\"6\">\n                <div style=\"{{ b.wrap }}\">\n                  <div style=\"{{ b.bar }}\">{{ b.val }}<\u002Fdiv>\n                  <div style=\"{{ b.plate }}\">nr. {{ b.idx }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"height:36px; margin:16px -26px 0; background:#4a463d; position:relative; overflow:hidden;\">\n              <div style=\"position:absolute; top:50%; left:0; right:0; height:3px; transform:translateY(-50%); background-image:repeating-linear-gradient(90deg,#efe6d4 0,#efe6d4 14px,transparent 14px,transparent 30px); background-size:30px 3px; animation:roadDash 1.1s linear infinite;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:13.5px; color:#6b6557; background:#f1ece0; border-radius:6px; padding:12px 16px; margin-top:18px;\">{{ sStatus }}<\u002Fdiv>\n\n          <div style=\"display:flex; gap:12px; margin-top:18px; flex-wrap:wrap;\">\n            <button onclick=\"{{ onSStep }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#6b6557; background:transparent; border:1.5px solid #d8cfbd; padding:11px 20px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#f1ece0;\">▶ Pas<\u002Fbutton>\n            <button onclick=\"{{ onSAuto }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#fff; background:#46624f; border:none; padding:11px 22px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#3a5141;\">Sortează automat<\u002Fbutton>\n            <button onclick=\"{{ onSShuffle }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#6b6557; background:transparent; border:1.5px solid #d8cfbd; padding:11px 20px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#f1ece0;\">Amestecă<\u002Fbutton>\n            <button onclick=\"{{ onSReset }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#6b6557; background:transparent; border:1.5px solid #d8cfbd; padding:11px 20px; border-radius:7px; cursor:pointer;\" style-hover=\"background:#f1ece0;\">↺ Reset<\u002Fbutton>\n          <\u002Fdiv>\n\n          <p style=\"font-size:14px; line-height:1.6; color:#8a8478; margin:20px 0 0; max-width:58ch;\">Această metodă (compară vecinii și schimbă-i) se numește <strong style=\"color:#6b6557;\">bubble sort<\u002Fstrong>. În practică folosim direct <code style=\"font-family:'JetBrains Mono',monospace; color:#6b6557;\">strada.sort()<\u002Fcode>, care ordonează lista pentru noi.<\u002Fp>\n        <\u002Fdiv>\n\n        <div id=\"exers\">\n          <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:6px;\">\n            <span style=\"width:8px; height:8px; border-radius:50%; background:#a8703f; display:inline-block; animation:bob 2.3s ease-in-out infinite;\"><\u002Fspan>\n            <h2 style=\"font-family:'Spectral',serif; font-size:26px; font-weight:600; margin:0; color:#262521;\">Exersează<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.65; color:#6b6557; margin:0 0 22px; max-width:58ch;\">Întrebări despre cum arată strada <strong>după sortarea crescătoare<\u002Fstrong>. Scrie răspunsul și apasă <strong>Verifică<\u002Fstrong>.<\u002Fp>\n          <sc-if value=\"{{ hasQuiz6 }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#fff; border:1px solid #e7e1d3; border-radius:14px; padding:26px 28px;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:4px;\">\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.06em; color:#a8703f; text-transform:uppercase;\">Întrebare<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#9a917f;\">{{ scoreText6 }}<\u002Fdiv>\n              <\u002Fdiv>\n              <h3 style=\"font-family:'Spectral',serif; font-size:23px; font-weight:600; margin:0; color:#262521; line-height:1.2;\">{{ questionText6 }}<\u002Fh3>\n              <div style=\"display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; align-items:center;\">\n                <input value=\"{{ answer6 }}\" oninput=\"{{ onInput6 }}\" onkeydown=\"{{ onKey6 }}\" placeholder=\"{{ placeholder6 }}\" inputmode=\"numeric\" style=\"width:130px; font-family:'JetBrains Mono',monospace; font-size:16px; color:#2b2a26; background:#faf7f0; border:1.5px solid #d8cfbd; border-radius:8px; padding:11px 14px; outline:none;\" style-focus=\"border-color:#46624f; background:#fff;\">\n                <button onclick=\"{{ onCheck6 }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#fff; background:#46624f; border:none; padding:11px 22px; border-radius:8px; cursor:pointer;\" style-hover=\"background:#3a5141;\">Verifică<\u002Fbutton>\n                <button onclick=\"{{ onNew6 }}\" style=\"font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:#6b6557; background:transparent; border:1.5px solid #d8cfbd; padding:11px 18px; border-radius:8px; cursor:pointer;\" style-hover=\"background:#f7f2e8;\">Întrebare nouă<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"{{ feedbackStyle6 }}\">{{ feedback6 }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n       <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;culoareCasa&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#7d9d8e&quot;, &quot;options&quot;: [&quot;#7d9d8e&quot;, &quot;#6f93a8&quot;, &quot;#b08a6a&quot;, &quot;#8f8aa8&quot;], &quot;tsType&quot;: &quot;string&quot; },\n  &quot;numeStrada&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Strada Brutăriei&quot;, &quot;tsType&quot;: &quot;string&quot; },\n  &quot;dificultate&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Ușor&quot;, &quot;Mediu&quot;], &quot;default&quot;: &quot;Ușor&quot;, &quot;tsType&quot;: &quot;string&quot; }\n}\">\nclass Component extends DCLogic {\n  state = {\n    tab: 'lista',\n    values: [5, 8, 3, 9, 2, 7], hover: -1, highlight: -1,\n    q1: { quiz: null, answer: '', status: null, score: 0, asked: 0 },\n    tvalues: [4, 7, 1, 9, 2, 6], cursor: 0, thover: -1, playing: false,\n    q2: { quiz: null, answer: '', status: null, score: 0, asked: 0 },\n    gFormula: 'i*2', gN: 5, gStep: 0, ghover: -1,\n    q3: { quiz: null, answer: '', status: null, score: 0, asked: 0 },\n    cWord: 'LISTĂ', chover: -1,\n    q4: { quiz: null, answer: '', status: null, score: 0, asked: 0 },\n    oValues: [5, 8, 3], oLog: ['strada = [5, 8, 3]'], oPos: '1', oVal: '7', ohover: -1, oRemoving: -1, hRemoving: -1, oBuilding: -1, hBuilding: -1, gBuilding: -1,\n    q5: { quiz: null, answer: '', status: null, score: 0, asked: 0 },\n    sValues: [5, 8, 3, 9, 2, 6], sI: 0, sJ: 0, sActive: [-1, -1], sSorted: false, sPhase: 'compare', sMsg: '',\n    q6: { quiz: null, answer: '', status: null, score: 0, asked: 0 },\n  };\n\n  themeNames = [\n    'Ce este o listă',\n    'Generarea elementelor',\n    'Liste de caractere',\n    'Parcurgere și căutare',\n    'Operații cu liste',\n    'Sortarea listelor',\n  ];\n\n  tabFor = { 0: 'lista', 1: 'generare', 2: 'caractere', 3: 'parcurgere', 4: 'operatii', 5: 'sortare' };\n\n  componentDidMount() {\n    [['q1', 'street'], ['q2', 'travel'], ['q3', 'gen'], ['q4', 'char'], ['q5', 'oper'], ['q6', 'sort']].forEach(p => this.newQuiz(p[0], p[1]));\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._timer);\n    clearInterval(this._gtimer);\n    clearInterval(this._stimer);\n  }\n\n  maxVal() { return (this.props.dificultate === 'Mediu') ? 20 : 9; }\n  defaultList() { return (this.props.dificultate === 'Mediu') ? [12, 5, 18, 3, 9, 14, 7] : [5, 8, 3, 9, 2, 7]; }\n\n  applyFormula(i) {\n    const f = this.state.gFormula;\n    if (f === 'i') return i;\n    if (f === 'i*2') return i * 2;\n    if (f === 'i+1') return i + 1;\n    if (f === 'i*i') return i * i;\n    return i;\n  }\n\n  valuesFor(type) {\n    switch (type) {\n      case 'street': return this.state.values;\n      case 'travel': return this.state.tvalues;\n      case 'gen': return Array.from({ length: this.state.gN }, (_, i) => this.applyFormula(i));\n      case 'char': return String(this.state.cWord).split('').filter(c => c !== ' ');\n      case 'oper': return this.state.oValues;\n      case 'sort': return [...this.state.sValues].sort((a, b) => a - b);\n      default: return [];\n    }\n  }\n\n  makeBar(v, i) {\n    const hc = this.props.culoareCasa || '#7d9d8e';\n    const active = this.state.sActive.indexOf(i) >= 0;\n    const col = active ? '#c08a5a' : hc;\n    const h = 38 + v * 7;\n    return {\n      val: v, idx: i,\n      wrap: { display: 'flex', flexDirection: 'column', alignItems: 'center', transition: 'transform .25s' },\n      bar: { width: 48, height: h, background: col, borderRadius: '7px 7px 0 0', display: 'flex', alignItems: 'flex-start', justifyContent: 'center', color: '#fff', fontFamily: \"'Spectral',serif\", fontSize: 19, fontWeight: 600, paddingTop: 7, boxShadow: active ? '0 0 0 4px rgba(192,138,90,.18)' : 'none', transition: 'height .3s, background-color .25s, box-shadow .25s' },\n      plate: { marginTop: 9, padding: '3px 10px', borderRadius: 5, background: '#f1ece0', fontFamily: \"'JetBrains Mono',monospace\", fontSize: 12, fontWeight: 600, color: '#8a7f6b' },\n    };\n  }\n\n  makeHouse(v, i, hiIdx, hoverIdx, hoverKey, removingIdx, buildingIdx) {\n    const hc = this.props.culoareCasa || '#7d9d8e';\n    const isHi = i === hiIdx;\n    const isHover = i === hoverIdx;\n    const isRemoving = i === removingIdx;\n    const isBuilding = i === buildingIdx;\n    const col = isHi ? '#c08a5a' : hc;\n    return {\n      val: v, idx: i,\n      wrap: { position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center', animation: isRemoving ? 'collapse .33s ease forwards' : 'popIn .35s ease both', transition: 'transform .2s', transform: isHover ? 'translateY(-4px)' : 'none' },\n      puff: isBuilding ? { position: 'absolute', left: '50%', top: -16, width: 96, height: 62, pointerEvents: 'none', zIndex: 5, animation: 'poof .55s ease forwards' } : { display: 'none' },\n      roof: { width: 0, height: 0, borderLeft: '44px solid transparent', borderRight: '44px solid transparent', borderBottom: '26px solid ' + col, transition: 'border-color .25s' },\n      body: { position: 'relative', width: 88, height: 72, background: '#fff', border: '2px solid ' + col, borderTop: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', paddingBottom: 14, boxShadow: isHi ? '0 0 0 5px rgba(192,138,90,.18)' : (isHover ? '0 7px 16px rgba(0,0,0,.10)' : 'none'), transition: 'box-shadow .25s, border-color .25s' },\n      num: { fontFamily: \"'Spectral',serif\", fontSize: 30, fontWeight: 600, color: '#2b2a26', lineHeight: 1 },\n      window: { position: 'absolute', top: 8, right: 13, width: 11, height: 11, background: col, opacity: 0.32, borderRadius: 2, transition: 'background-color .25s' },\n      door: { position: 'absolute', bottom: 0, left: '50%', transform: 'translateX(-50%)', width: 16, height: 20, background: col, borderRadius: '3px 3px 0 0', transition: 'background-color .25s' },\n      plate: { marginTop: 9, padding: '3px 10px', borderRadius: 5, background: isHi ? '#f3e3d2' : '#f1ece0', fontFamily: \"'JetBrains Mono',monospace\", fontSize: 12, fontWeight: 600, color: isHi ? '#a8703f' : '#8a7f6b', transition: '.25s' },\n      onEnter: () => this.setState({ [hoverKey]: i }),\n      onLeave: () => this.setState({ [hoverKey]: -1 }),\n    };\n  }\n\n  setQ(key, patch) { this.setState(s => ({ [key]: { ...s[key], ...patch } })); }\n\n  newQuiz(key, type) {\n    const vals = this.valuesFor(type);\n    const n = vals.length;\n    if (n === 0) { this.setQ(key, { quiz: null, answer: '', status: null }); return; }\n    let kind = Math.random() < 0.5 ? 'who' : 'where';\n    const counts = {};\n    vals.forEach(v => { counts[v] = (counts[v] || 0) + 1; });\n    const uniq = vals.map((v, i) => ({ v, i })).filter(o => counts[o.v] === 1);\n    if (kind === 'where' && uniq.length === 0) kind = 'who';\n    let quiz;\n    if (kind === 'who') {\n      const k = Math.floor(Math.random() * n);\n      quiz = { kind, k, correctVal: vals[k] };\n    } else {\n      const p = uniq[Math.floor(Math.random() * uniq.length)];\n      quiz = { kind, val: p.v, correctIdx: p.i };\n    }\n    this.setQ(key, { quiz, answer: '', status: null });\n    if (key === 'q1') this.setState({ highlight: -1 });\n  }\n\n  checkQ(key, setHi) {\n    const mod = this.state[key];\n    const q = mod.quiz;\n    if (!q) return;\n    const ans = String(mod.answer).trim();\n    if (ans === '') return;\n    const norm = (x) => String(x).trim().toUpperCase();\n    let correct, hl = -1;\n    if (q.kind === 'who') { correct = norm(ans) === norm(q.correctVal); hl = q.k; }\n    else { correct = Number(ans) === q.correctIdx; hl = correct ? q.correctIdx : -1; }\n    const firstTry = mod.status === null;\n    this.setQ(key, { status: correct ? 'ok' : 'no', score: mod.score + (correct && firstTry ? 1 : 0), asked: mod.asked + (firstTry ? 1 : 0) });\n    if (setHi) this.setState({ highlight: hl });\n  }\n\n  mutateStreet(fn) {\n    this.setState(s => ({ values: fn(s.values.slice()) }), () => this.newQuiz('q1', 'street'));\n  }\n  addHouse() {\n    if (this.state.values.length >= 9) return;\n    const max = this.maxVal();\n    let v, tries = 0;\n    do { v = Math.floor(Math.random() * (max + 1)); tries++; } while (this.state.values.includes(v) && tries < 25);\n    this.setState({ hBuilding: this.state.values.length });\n    this.mutateStreet(arr => { arr.push(v); return arr; });\n    setTimeout(() => this.setState({ hBuilding: -1 }), 520);\n  }\n  removeHouse() {\n    if (this.state.values.length <= 1 || this.state.hRemoving >= 0) return;\n    const last = this.state.values.length - 1;\n    this.setState({ hRemoving: last });\n    setTimeout(() => { this.setState({ hRemoving: -1 }); this.mutateStreet(arr => { arr.pop(); return arr; }); }, 320);\n  }\n  resetStreet() {\n    this.setState({ values: this.defaultList() }, () => this.newQuiz('q1', 'street'));\n  }\n\n  stopPlay() { clearInterval(this._timer); this.setState({ playing: false }); }\n  togglePlay() {\n    if (this.state.playing) { this.stopPlay(); return; }\n    if (this.state.cursor >= this.state.tvalues.length - 1) this.setState({ cursor: 0 });\n    this.setState({ playing: true });\n    this._timer = setInterval(() => {\n      this.setState(s => {\n        if (s.cursor >= s.tvalues.length - 1) { clearInterval(this._timer); return { playing: false }; }\n        return { cursor: s.cursor + 1 };\n      });\n    }, 950);\n  }\n  stepNext() { this.stopPlay(); this.setState(s => ({ cursor: Math.min(s.cursor + 1, s.tvalues.length - 1) })); }\n  stepPrev() { this.stopPlay(); this.setState(s => ({ cursor: Math.max(s.cursor - 1, 0) })); }\n  resetTrav() { this.stopPlay(); this.setState({ cursor: 0 }); }\n  newTravStreet() {\n    this.stopPlay();\n    const set = new Set();\n    while (set.size < 6) set.add(Math.floor(Math.random() * (this.maxVal() + 1)));\n    this.setState({ tvalues: [...set], cursor: 0 }, () => this.newQuiz('q2', 'travel'));\n  }\n\n  setFormula(f) { this.setState({ gFormula: f, gStep: 0 }, () => this.newQuiz('q3', 'gen')); }\n  setGN(d) { this.setState(s => ({ gN: Math.max(3, Math.min(8, s.gN + d)), gStep: 0 }), () => this.newQuiz('q3', 'gen')); }\n  stopGen() { clearInterval(this._gtimer); }\n  genStep() { this.stopGen(); this.setState(s => ({ gStep: Math.min(s.gStep + 1, s.gN), gBuilding: s.gStep })); setTimeout(() => this.setState({ gBuilding: -1 }), 520); }\n  genAuto() {\n    if (this.state.gStep >= this.state.gN) this.setState({ gStep: 0 });\n    this.stopGen();\n    this._gtimer = setInterval(() => {\n      this.setState(s => { if (s.gStep >= s.gN) { clearInterval(this._gtimer); return { gBuilding: -1 }; } return { gStep: s.gStep + 1, gBuilding: s.gStep }; });\n    }, 700);\n  }\n  genReset() { this.stopGen(); this.setState({ gStep: 0 }); }\n\n  setWord(e) {\n    const w = String(e.target.value).toUpperCase().replace(/[^A-ZĂÂÎȘȚ]/g, '').slice(0, 9);\n    this.setState({ cWord: w }, () => this.newQuiz('q4', 'char'));\n  }\n\n  parseP() { const n = parseInt(this.state.oPos, 10); return isNaN(n) ? 0 : n; }\n  parseN(x) { const n = parseInt(x, 10); return isNaN(n) ? 0 : n; }\n  pushLog(log, line) { return [...log, '>>> ' + line].slice(-6); }\n  setOPos(e) { this.setState({ oPos: e.target.value }); }\n  setOVal(e) { this.setState({ oVal: e.target.value }); }\n  opAppend() {\n    const v = this.parseN(this.state.oVal);\n    this.setState({ oBuilding: this.state.oValues.length });\n    this.setState(s => ({ oValues: [...s.oValues, v], oLog: this.pushLog(s.oLog, 'strada.append(' + v + ')') }), () => this.newQuiz('q5', 'oper'));\n    setTimeout(() => this.setState({ oBuilding: -1 }), 520);\n  }\n  opInsert() {\n    const v = this.parseN(this.state.oVal), p = this.parseP();\n    const pos = Math.max(0, Math.min(p, this.state.oValues.length));\n    this.setState({ oBuilding: pos });\n    this.setState(s => { const a = s.oValues.slice(); a.splice(pos, 0, v); return { oValues: a, oLog: this.pushLog(s.oLog, 'strada.insert(' + pos + ', ' + v + ')') }; }, () => this.newQuiz('q5', 'oper'));\n    setTimeout(() => this.setState({ oBuilding: -1 }), 520);\n  }\n  opPop() {\n    if (!this.state.oValues.length || this.state.oRemoving >= 0) return;\n    const last = this.state.oValues.length - 1;\n    this.setState({ oRemoving: last });\n    setTimeout(() => {\n      this.setState(s => { const a = s.oValues.slice(); a.pop(); return { oValues: a, oRemoving: -1, oLog: this.pushLog(s.oLog, 'strada.pop()') }; }, () => this.newQuiz('q5', 'oper'));\n    }, 320);\n  }\n  opDel() {\n    const p = this.parseP();\n    if (p < 0 || p >= this.state.oValues.length || this.state.oRemoving >= 0) return;\n    this.setState({ oRemoving: p });\n    setTimeout(() => {\n      this.setState(s => { const a = s.oValues.slice(); a.splice(p, 1); return { oValues: a, oRemoving: -1, oLog: this.pushLog(s.oLog, 'del strada[' + p + ']') }; }, () => this.newQuiz('q5', 'oper'));\n    }, 320);\n  }\n  opSet() {\n    const p = this.parseP(), v = this.parseN(this.state.oVal);\n    this.setState(s => { const a = s.oValues.slice(); if (p < 0 || p >= a.length) return {}; a[p] = v; return { oValues: a, oLog: this.pushLog(s.oLog, 'strada[' + p + '] = ' + v) }; }, () => this.newQuiz('q5', 'oper'));\n  }\n  opReset() { this.setState({ oValues: [5, 8, 3], oLog: ['strada = [5, 8, 3]'] }, () => this.newQuiz('q5', 'oper')); }\n\n  stopSort() { clearInterval(this._stimer); }\n  sStep() {\n    if (this.state.sSorted) { this.stopSort(); return; }\n    const n = this.state.sValues.length;\n    const i = this.state.sI, j = this.state.sJ;\n    if (this.state.sPhase === 'compare') {\n      this.setState({ sActive: [j, j + 1], sPhase: 'swap', sMsg: 'Comparăm casele de la adresele ' + j + ' și ' + (j + 1) + '…' });\n      return;\n    }\n    const a = this.state.sValues.slice();\n    let msg;\n    if (a[j] > a[j + 1]) { const t = a[j]; a[j] = a[j + 1]; a[j + 1] = t; msg = a[j] + ' < ' + a[j + 1] + ' acum — erau în ordine greșită, le-am schimbat.'; }\n    else { msg = a[j] + ' ≤ ' + a[j + 1] + ' — sunt deja în ordine, mergem mai departe.'; }\n    let nj = j + 1, ni = i, sorted = false;\n    if (nj >= n - 1 - i) { nj = 0; ni = i + 1; if (ni >= n - 1) sorted = true; }\n    this.setState({ sValues: a, sI: ni, sJ: nj, sPhase: 'compare', sActive: sorted ? [-1, -1] : [j, j + 1], sSorted: sorted, sMsg: sorted ? '' : msg });\n  }\n  sAuto() {\n    this.stopSort();\n    this._stimer = setInterval(() => { if (this.state.sSorted) { clearInterval(this._stimer); return; } this.sStep(); }, 560);\n  }\n  sShuffle() {\n    this.stopSort();\n    const a = [...this.state.sValues];\n    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }\n    this.setState({ sValues: a, sI: 0, sJ: 0, sActive: [-1, -1], sSorted: false, sPhase: 'compare', sMsg: '' }, () => this.newQuiz('q6', 'sort'));\n  }\n  sReset() { this.stopSort(); this.setState({ sValues: [5, 8, 3, 9, 2, 6], sI: 0, sJ: 0, sActive: [-1, -1], sSorted: false, sPhase: 'compare', sMsg: '' }, () => this.newQuiz('q6', 'sort')); }\n\n  quizFields(key, type) {\n    const mod = this.state[key];\n    const q = mod.quiz;\n    const isLetter = type === 'char';\n    let questionText = '', placeholder = '';\n    if (q) {\n      if (q.kind === 'who') {\n        const K = q.k;\n        questionText = ({\n          street: 'Ce număr stă la adresa ' + K + '?',\n          travel: 'Ce valoare citește poștașul la pasul i = ' + K + '?',\n          gen: 'Ce valoare are casa de la adresa ' + K + ' după generare?',\n          char: 'Ce literă este la poziția ' + K + '?',\n          oper: 'Ce valoare este la adresa ' + K + ' acum?',\n          sort: 'După sortarea crescătoare, ce număr ajunge la adresa ' + K + '?',\n        })[type];\n        placeholder = isLetter ? 'ex: A' : 'ex: 7';\n      } else {\n        const V = q.val;\n        questionText = ({\n          street: 'La ce adresă stă numărul ' + V + '?',\n          travel: 'La ce pas (i) ajunge poștașul la numărul ' + V + '?',\n          gen: 'La ce adresă se află valoarea ' + V + '?',\n          char: 'La ce poziție este litera ' + V + '?',\n          oper: 'La ce adresă se află valoarea ' + V + '?',\n          sort: 'După sortarea crescătoare, la ce adresă ajunge numărul ' + V + '?',\n        })[type];\n        placeholder = 'ex: 0';\n      }\n    }\n    const st = mod.status;\n    const feedback = st === 'ok' ? 'Corect!' : st === 'no' ? 'Nu chiar. Mai uită-te o dată și încearcă din nou.' : '';\n    const feedbackStyle = { minHeight: 22, marginTop: 16, fontFamily: \"'DM Sans',sans-serif\", fontSize: 15, fontWeight: 600, color: st === 'ok' ? '#3a7a55' : st === 'no' ? '#b56a52' : 'transparent' };\n    return {\n      hasQuiz: !!q, questionText, placeholder, answer: mod.answer,\n      onInput: (e) => this.setQ(key, { answer: e.target.value }),\n      on  'Lecția 6 din 6\\nSortare' };\n\n    const cursor = this.state.cursor;\n    const tval = this.state.tvalues[cursor];\n    const spread = (f, suf) => ({ ['hasQuiz' + suf]: f.hasQuiz, ['questionText' + suf]: f.questionText, ['placeholder' + suf]: f.placeholder, ['answer' + suf]: f.answer, ['onInput' + suf]: f.onInput, ['onKey' + suf]: f.onKey, ['onCheck' + suf]: f.onCheck, ['onNew' + suf]: f.onNew, ['feedback' + suf]: f.feedback, ['feedbackStyle' + suf]: f.feedbackStyle, ['scoreText' + suf]: f.scoreText });\n\n    const gBuilt = Array.from({ length: this.state.gStep }, (_, i) => this.applyFormula(i));\n    const gPyMap = { 'i': 'i', 'i*2': 'i * 2', 'i+1': 'i + 1', 'i*i': 'i * i' };\n    const gOpts = [['i', 'i'], ['i*2', 'i × 2'], ['i+1', 'i + 1'], ['i*i', 'i × i']].map(o => {\n      const act = this.state.gFormula === o[0];\n      return { label: o[1], onClick: () => this.setFormula(o[0]), style: { fontFamily: \"'JetBrains Mono',monospace\", fontSize: 13, fontWeight: 600, padding: '8px 15px', borderRadius: 7, cursor: 'pointer', border: '1.5px solid ' + (act ? '#46624f' : '#d8cfbd'), background: act ? '#46624f' : '#fff', color: act ? '#fff' : '#6b6557' } };\n    });\n\n    const cArr = String(this.state.cWord).split('');\n\n    let sStatus;\n    if (this.state.sSorted) sStatus = 'Gata — strada e ordonată crescător.';\n    else if (this.state.sMsg) sStatus = this.state.sMsg;\n    else sStatus = 'Apasă „Pas\" sau „Sortează automat\" ca să începi.';\n\n    return {\n      tab,\n      tabLista: tab === 'lista', tabGenerare: tab === 'generare', tabCaractere: tab === 'caractere',\n      tabParcurgere: tab === 'parcurgere', tabOperatii: tab === 'operatii', tabSortare: tab === 'sortare',\n      teme, subnav, pageTag: tags[tab] || tags.lista,\n      numeStrada: this.props.numeStrada || 'Strada Brutăriei',\n\n      houses: this.state.values.map((v, i) => this.makeHouse(v, i, this.state.highlight, this.state.hover, 'hover', this.state.hRemoving, this.state.hBuilding)),\n      streetCode: 'strada = [' + this.state.values.join(', ') + ']',\n      onAdd: () => this.addHouse(), onRemove: () => this.removeHouse(), onReset: () => this.resetStreet(),\n      ...spread(this.quizFields('q1', 'street'), ''),\n\n      thouses: this.state.tvalues.map((v, i) => this.makeHouse(v, i, cursor, this.state.thover, 'thover')),\n      cursor,\n      markerStyle: { position: 'absolute', left: cursor * 108 + 44, bottom: '100%', marginBottom: 6, transform: 'translateX(-50%)', transition: 'left .45s cubic-bezier(.34,1.3,.5,1)', zIndex: 3, display: 'flex', flexDirection: 'column', alignItems: 'center' },\n      stepText: 'pasul ' + (cursor + 1) + ' din ' + this.state.tvalues.length,\n      loopComment: '# i = ' + cursor + '  →  strada[' + cursor + '] = ' + tval,\n      visitedList: this.state.tvalues.slice(0, cursor + 1).map((v, i) => ({ val: v, idx: i })),\n      playLabel: this.state.playing ? '⏸ Pauză' : '▶ Pornește mersul',\n      onPrev: () => this.stepPrev(), onNext: () => this.stepNext(), onPlay: () => this.togglePlay(), onNewStreet: () => this.newTravStreet(), onResetTrav: () => this.resetTrav(),\n      ...spread(this.quizFields('q2', 'travel'), '2'),\n\n      gOpts, gN: this.state.gN,\n      onGDec: () => this.setGN(-1), onGInc: () => this.setGN(1),\n      gHouses: gBuilt.map((v, i) => this.makeHouse(v, i, this.state.gStep - 1, this.state.ghover, 'ghover', -1, this.state.gBuilding)),\n      gForRange: 'for i in range(' + this.state.gN + '):',\n      gPyFormula: gPyMap[this.state.gFormula],\n      gBuiltCode: 'strada = [' + gBuilt.join(', ') + ']',\n      gComment: this.state.gStep >= this.state.gN ? ('# gata — ' + this.state.gN + ' case construite') : ('# i = ' + this.state.gStep + '  →  append(' + this.applyFormula(this.state.gStep) + ')'),\n      gStepText: 'construite: ' + this.state.gStep + ' / ' + this.state.gN,\n      onGenStep: () => this.genStep(), onGenAuto: () => this.genAuto(), onGenReset: () => this.genReset(),\n      ...spread(this.quizFields('q3', 'gen'), '3'),\n\n      cWord: this.state.cWord, onWord: (e) => this.setWord(e),\n      cHouses: cArr.map((ch, i) => this.makeHouse(ch, i, -1, this.state.chover, 'chover')),\n      cCode: 'cuvant = \"' + this.state.cWord + '\"',\n      cLen: cArr.length,\n      cExample: cArr.length ? ('cuvant[0]  →  \"' + cArr[0] + '\"') : ' ',\n      ...spread(this.quizFields('q4', 'char'), '4'),\n\n      oHouses: this.state.oValues.map((v, i) => this.makeHouse(v, i, -1, this.state.ohover, 'ohover', this.state.oRemoving, this.state.oBuilding)),\n      oEmpty: this.state.oValues.length === 0,\n      oPos: this.state.oPos, oVal: this.state.oVal,\n      onOPos: (e) => this.setOPos(e), onOVal: (e) => this.setOVal(e),\n      oLogLines: this.state.oLog.map(t => ({ t })),\n      onAppendOp: () => this.opAppend(), onInsertOp: () => this.opInsert(), onPopOp: () => this.opPop(), onDelOp: () => this.opDel(), onSetOp: () => this.opSet(), onResetOp: () => this.opReset(),\n      ...spread(this.quizFields('q5', 'oper'), '5'),\n\n      sBars: this.state.sValues.map((v, i) => this.makeBar(v, i)),\n      sStatus, sSortedFlag: this.state.sSorted,\n      onSStep: () => this.sStep(), onSAuto: () => this.sAuto(), onSShuffle: () => this.sShuffle(), onSReset: () => this.sReset(),\n      ...spread(this.quizFields('q6', 'sort'), '6'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
