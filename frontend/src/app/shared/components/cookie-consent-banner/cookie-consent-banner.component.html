@if (visible) {
  <div class="cookie-banner">
    <p class="cookie-banner__text">
      Folosim cookie-uri strict pentru a măsura traficul (Google Analytics), doar cu acordul tău. Poți afla
      mai multe și îți poți schimba oricând opțiunea în
      <a [routerLink]="['/termeni-si-conditii']">termenii și condițiile</a> platformei.
    </p>
    <div class="cookie-banner__actions">
      <button type="button" class="cookie-banner__btn cookie-banner__btn--refuse" (click)="refuse()">
        Refuz
      </button>
      <button type="button" class="cookie-banner__btn cookie-banner__btn--accept" (click)="accept()">
        Accept
      </button>
    </div>
  </div>
}
